name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags: '*'
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write
  actions: write        # let julia-actions/cache evict its own caches

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        # make.jl uses the split build (build_vitepress=false + explicit
        # DocumenterVitepress.build_docs), which shells out to
        # `npm run env -- vitepress build …` without running `npm install`
        # itself, so vitepress must be installed before the Julia build
        # (ci skill §6g).
        run: cd docs && npm install
      - name: Install dependencies
        run: julia --project=docs docs/instantiate.jl
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
